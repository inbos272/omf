// Runs the real Durable Object classes and the real game client (net.js + sim.js + bot.js)
// against an in-page fake of the Cloudflare runtime: storage, alarms, WebSocket pairs.
import * as rules from '../server/src/rules.js';
import { Matchmaker } from '../server/src/matchmaker.js';
import { Room } from '../server/src/room.js';
import { Ledger } from '../server/src/ledger.js';
import worker from '../server/src/index.js';

const S = window.SKY, C = S.CFG, lines = [];
const log = (s) => lines.push(s);
// Let pending microtasks and a few macrotasks run (Response bodies resolve on tasks). MessageChannel
// yields are much faster than setTimeout(0), which matters when the race loop flushes ~1,400 times.
const mc = new MessageChannel(), waiters = [];
mc.port1.onmessage = () => { const w = waiters.shift(); if (w) w(); };
const task = () => new Promise((r) => { waiters.push(r); mc.port2.postMessage(0); });
const flush = async () => { for (let i = 0; i < 3; i++) { for (let j = 0; j < 20; j++) await null; await task(); } };

// ---------- fake runtime ----------
let clock = 1700000000000;
class Storage {
  constructor() { this.map = new Map(); this.alarm = null; }
  async get(k) { const v = this.map.get(k); return v === undefined ? undefined : structuredClone(v); }
  async put(k, v) { this.map.set(k, structuredClone(v)); }
  async delete(k) { return this.map.delete(k); }
  async setAlarm(t) { this.alarm = t; }
}
class Ctx {
  constructor() { this.storage = new Storage(); this.sockets = []; }
  acceptWebSocket(ws) { this.sockets.push(ws); }
  getWebSockets() { return this.sockets.filter((s) => !s.closed); }
}
function pair(owner) {
  const server = { closed: false, att: null }, client = { closed: false, onmessage: null, onclose: null, onerror: null };
  server.send = (d) => { if (!client.closed) queueMicrotask(() => client.onmessage && client.onmessage({ data: d })); };
  server.close = () => {
    if (server.closed) return;
    server.closed = client.closed = true;
    queueMicrotask(() => { client.onclose && client.onclose({}); owner().webSocketClose(server); });
  };
  server.serializeAttachment = (v) => { server.att = v === null ? null : structuredClone(v); };
  server.deserializeAttachment = () => (server.att ? structuredClone(server.att) : null);
  client.send = (d) => { if (!server.closed) queueMicrotask(() => owner().webSocketMessage(server, d)); };
  client.close = () => {
    if (client.closed) return;
    server.closed = client.closed = true;
    queueMicrotask(() => { client.onclose && client.onclose({}); owner().webSocketClose(server); });
  };
  return { server, client };
}
function makeEnv() {
  const env = { NOW: () => clock };
  let n = 0;
  const ns = (Cls) => {
    const inst = new Map();
    return {
      inst,
      idFromName: (name) => ({ name, toString: () => name }),
      newUniqueId: () => { const name = 'room-' + ++n; return { name, toString: () => name }; },
      idFromString: (name) => ({ name, toString: () => name }),
      get(id) {
        if (!inst.has(id.name)) inst.set(id.name, new Cls(new Ctx(), env));
        const o = inst.get(id.name);
        return { fetch: (u, init) => o.fetch(new Request(u, init)), o };
      },
    };
  };
  env.LEDGER = ns(Ledger);
  env.MATCH = ns(Matchmaker);
  env.ROOM = ns(Room);
  // What the Worker + DO fetch handlers do for a WebSocket upgrade, minus the 101 response.
  env.socket = (url) => {
    const u = new URL(url), q = u.searchParams;
    if (u.pathname === '/play') {
      const mm = env.MATCH.get(env.MATCH.idFromName(q.get('mode'))).o;
      const p = pair(() => mm);
      queueMicrotask(() => mm.join(p.server, { mode: q.get('mode'), pid: q.get('pid'), name: rules.sanitizeName(q.get('name')), skin: q.get('skin'), ab: q.get('ab') }));
      return p.client;
    }
    const room = env.ROOM.get(env.ROOM.idFromString(q.get('id'))).o;
    const p = pair(() => room);
    queueMicrotask(() => room.join(p.server, q.get('pid'), q.get('token')));
    return p.client;
  };
  return env;
}

// ---------- a headless game client, following the same steps as main.js ----------
function makeClient(env, name, skin, skill) {
  const c = { name, skin, ended: null, lost: false, hosted: false, queueSeen: 0, events: 0 };
  c.net = new S.Net({ baseUrl: 'https://fake', socketFactory: env.socket, now: () => clock });
  c.me = { pid: 'pid-' + name, name, skin, ab: '' };
  c.bot = new S.Bot(skill, name.length * 31 + 7, 0.3);
  c.handlers = {
    queue: () => { c.queueSeen++; },
    hello: (msg) => {
      c.sim = new S.Sim((ev, a) => { if (ev === 'trigger') c.net.sendEvent({ k: 'tr', f: a.floor, sd: a.side ? 1 : 0 }); });
      const racers = S.onlineRacers(msg, c.net.slot, c.net.isHost);
      c.sim.reset(msg.seed, 0, { perk: S.perkFor(null), skin: S.SKINS[0], ab: null, online: true, racers, mySlot: c.net.slot });
      c.hosted = c.net.isHost;
    },
    host: () => { if (c.sim) S.onlineTakeover(c.sim, c.net); },
    event: (m) => { if (m.k === 'tr' && c.sim) { c.sim.triggerRemote(m.f, !!m.sd); c.events++; } },
    end: (m) => { c.ended = m; },
    error: (code) => { c.error = code; },
    lost: () => { c.lost = true; },
  };
  c.sent = false;
  c.aiSent = false;
  return c;
}

async function race(env, clients, opts) {
  opts = opts || {};
  const dt = C.DT;
  const startAt = clients[0].net.startAt;
  let maxGap = 0;
  const total = Math.ceil((startAt - clock) / 1000 / dt + (S.RACE.dur + 2) / dt);
  for (let step = 0; step < total; step++) {
    clock += dt * 1000;
    const elapsed = (clock - startAt) / 1000;
    for (const c of clients) {
      if (c.dropped || !c.sim) continue;
      if (elapsed >= 0 && !c.sim.started) c.sim.started = true;
      if (!c.sim.started) continue;
      c.sim.runTime = Math.max(0, elapsed - dt);
      c.sim.step(c.sim.dead ? { move: 0, jump: false } : c.bot.update(c.sim, dt));
      c.net.update(c.sim, dt);
      if (opts.killAt && elapsed >= opts.killAt && !c.sim.dead) c.sim.p.y = c.sim.lavaY - 1; // everyone falls early
      if (!c.sent && (c.sim.dead || elapsed >= S.RACE.dur)) {
        c.sent = true;
        c.net.sendResult(c.sim.p);
      }
      // Same host duty as main.js: report fallen AI, fast-forward them once all humans are out.
      if (!c.noSettle) c.net.settleAi(c.sim, S.RACE.dur - elapsed, (ais, left) => {
        for (let t = left; t > 0 && ais.some((b) => !b.dead); t -= dt) c.sim.step({ move: 0, jump: false });
      });
    }
    if (opts.stopAt && elapsed >= opts.stopAt) break;
    if (opts.stopWhenEnded && clients.every((c) => c.ended || c.dropped)) {
      opts.endedAt = (clock - startAt) / 1000;
      break;
    }
    if (opts.dropAt && elapsed >= opts.dropAt && !opts.dropped) {
      opts.dropped = true;
      const h = clients.find((c) => c.net.isHost);
      h.dropped = true;
      h.net.close();
    }
    // How far apart do two clients see the same player? (sync quality)
    if (step % 120 === 0 && elapsed > 2 && elapsed < 80 && clients.length > 1 && !clients[0].dropped && !clients[1].dropped) {
      const a = clients[0], b = clients[1];
      const ghost = b.sim.bodies.find((x) => x.slot === a.net.slot);
      if (ghost && !a.sim.dead && !ghost.dead) maxGap = Math.max(maxGap, Math.hypot(S.wrapD(ghost.x - a.sim.p.x), ghost.y - a.sim.p.y));
    }
    if (step % 8 === 0) await flush();
  }
  for (let i = 0; i < 20; i++) await flush();
  return maxGap;
}

// ---------- tests ----------
function unitRules() {
  const ok = [
    rules.tierFor(0) === 'bronze', rules.tierFor(299) === 'bronze', rules.tierFor(300) === 'silver', rules.tierFor(2600) === 'master',
    rules.rpDelta(1, 0) === 40, rules.rpDelta(5, 10) === -10, rules.rpDelta(5, 500) === -20,
    rules.orderResults([{ slot: 0, floor: 5, floorT: 3 }, { slot: 1, floor: 9, floorT: 9 }, { slot: 2, floor: 9, floorT: 4 }, { slot: 3, dc: true, floor: 50 }]).map((e) => e.slot).join() === '2,1,0,3',
    rules.pickGroup([{ rp: 0, joined: 0 }], 5000, 'casual') === null,
    rules.pickGroup([{ rp: 0, joined: 0 }], 10000, 'casual').ai === 4,
    rules.pickGroup(Array.from({ length: 6 }, (_, i) => ({ rp: i * 100, joined: i })), 1, 'casual').players.length === 5,
    rules.sanitizeName('  <b>Hi\u0001</b>  ') === 'bHi/b', rules.sanitizeName('') === 'Climber',
    rules.nameKey('Sky Ace') === rules.nameKey('ｓｋｙａｃｅ'),
    rules.placementRp([1, 1, 1, 1, 1]) === 850, rules.placementRp([1, 2, 1, 3, 2]) === 730, rules.placementRp([3, 2, 4, 3, 3]) === 400,
    rules.placementRp([5, 4, 5, 3, 4]) === 125, rules.placementRp([5, 5, 5, 5, 5]) === 0,
    rules.regionOf({ continent: 'AS', longitude: 127 }) === 'apac', rules.regionOf({ continent: 'NA', longitude: -122 }) === 'wnam', rules.regionOf(null) === '',
    rules.majorityRegion(['apac', 'weur', 'apac', '']) === 'apac',
    // Nearby players are grouped before a far-away one who queued earlier.
    rules.pickGroup([{ region: 'apac', joined: 0 }, { region: 'weur', joined: 1 }, ...[2, 3, 4, 5].map((j) => ({ region: 'apac', joined: j }))], 6, 'casual')
      .players.every((p) => p.region === 'apac'),
  ];
  log(`RULES: ${ok.filter(Boolean).length}/${ok.length} checks pass`);
  return ok.every(Boolean);
}

async function casualMatch() {
  const env = makeEnv();
  const clients = [makeClient(env, 'Ann', 'mint', 0.8), makeClient(env, 'Bo', 'cat', 0.6), makeClient(env, 'Cy', 'frog', 0.5)];
  for (const c of clients) c.net.find('casual', c.me, c.handlers);
  await flush();
  const queued = clients.every((c) => c.queueSeen > 0);
  clock += 10500;
  await env.MATCH.get(env.MATCH.idFromName('casual')).o.alarm();
  for (let i = 0; i < 10; i++) await flush();
  const joined = clients.every((c) => c.sim && c.net.phase === 'room');
  const roster = clients[0].net.roster;
  const hosts = clients.filter((c) => c.net.isHost).length;
  const maxGap = await race(env, clients);
  const ends = clients.filter((c) => c.ended).length;
  const order = clients[0].ended ? clients[0].ended.order : [];
  const winnerSlot = order.length ? order[0].slot : -1;
  const winner = clients.find((c) => c.net.slot === winnerSlot);
  let ledgerOk = true;
  if (winner) {
    const prof = await env.LEDGER.get(env.LEDGER.idFromName('global')).o.get(winner.me.pid);
    ledgerOk = prof.casualWins === 1;
  }
  const sameOrder = clients.every((c) => c.ended && JSON.stringify(c.ended.order) === JSON.stringify(order));
  // Every client must agree on where each slot started (no bodies spawning inside each other).
  const humansClimbed = clients.every((c) => order.find((o) => o.slot === c.net.slot).floor >= 5);
  log(`CASUAL: queued=${queued} joined=${joined} roster=${roster.length} (AI ${roster.filter((r) => r.ai).length}) hosts=${hosts} | ghost sync max gap ${maxGap.toFixed(2)} | end msgs ${ends}/3, same order=${sameOrder}, winner ${winner ? winner.name : 'AI'} casualWins ok=${ledgerOk}`);
  log(`  order: ${order.map((o) => `${o.slot}:${o.floor}${o.dc ? 'dc' : ''}`).join(' ')} | trigger events relayed ${clients.reduce((s, c) => s + c.events, 0)}`);
  // 120 ms interpolation delay plus one 15 Hz send interval at up to ~27 u/s (bounce pads)
  // bounds how far a ghost can trail: about 5 units.
  return queued && joined && roster.length === 5 && hosts === 1 && maxGap < 5.5 && ends === 3 && sameOrder && ledgerOk && humansClimbed;
}

async function rankedHostDrop() {
  const env = makeEnv();
  const ledger = env.LEDGER.get(env.LEDGER.idFromName('global')).o;
  // Players saved before placement matches existed (ranked games played, no `placed` field).
  for (const n of ['Dee', 'Eli']) await ledger.ctx.storage.put('p:pid-' + n, { pid: 'pid-' + n, name: n, rp: 650, casualWins: 5, rankedGames: 3 });
  const locked = makeClient(env, 'Fin', 'bot', 0.5);
  locked.net.find('ranked', locked.me, locked.handlers);
  await flush();
  const lockOk = locked.error === 'locked';
  const clients = [makeClient(env, 'Dee', 'king', 0.7), makeClient(env, 'Eli', 'ninja', 0.7)];
  for (const c of clients) c.net.find('ranked', c.me, c.handlers);
  await flush();
  clock += 10500;
  await env.MATCH.get(env.MATCH.idFromName('ranked')).o.alarm();
  for (let i = 0; i < 10; i++) await flush();
  const hostBefore = clients.find((c) => c.net.isHost);
  const opts = { dropAt: 8 };
  await race(env, clients, opts);
  const other = clients.find((c) => c !== hostBefore);
  const tookOver = other.net.isHost && other.sim.bodies.some((b) => !b.human && !b.remote && other.net.roster[b.slot].ai);
  const end = other.ended;
  const dropped = end && end.order.find((o) => o.slot === hostBefore.net.slot);
  const lastIsDropped = end && end.order[end.order.length - 1].slot === hostBefore.net.slot && dropped.dc;
  const pDrop = await ledger.get(hostBefore.me.pid), pOther = await ledger.get(other.me.pid);
  const rpOk = pDrop.rp === 630 && pOther.rp !== 650 && pOther.rankedGames === 4;
  log(`RANKED: locked before 5 wins=${lockOk} | host dropped at 8s → new host took AI=${tookOver} | dropped player last+dc=${lastIsDropped} | RP ${pDrop.rp} (dropped) / ${pOther.rp} (other) ok=${rpOk}`);
  return lockOk && tookOver && lastIsDropped && rpOk;
}

// Everyone human falls at 5 s: the room must end right away (AI played out by the host),
// and a player who left cannot rejoin the same room to replace their forfeit.
async function earlyEndAndRejoin() {
  const env = makeEnv();
  const clients = [makeClient(env, 'Gus', 'mint', 0.7), makeClient(env, 'Hal', 'cat', 0.7)];
  for (const c of clients) c.net.find('casual', c.me, c.handlers);
  await flush();
  clock += 10500;
  await env.MATCH.get(env.MATCH.idFromName('casual')).o.alarm();
  for (let i = 0; i < 10; i++) await flush();
  const opts = { killAt: 5, stopWhenEnded: true };
  await race(env, clients, opts);
  const end = clients[0].ended;
  const aiFloors = end ? end.order.filter((o) => clients[0].net.roster[o.slot].ai).map((o) => o.floor) : [];
  const early = end && opts.endedAt < 30;

  // Forfeit then try to come back with the same room token.
  const env2 = makeEnv();
  const a = makeClient(env2, 'Ivy', 'frog', 0.6), b = makeClient(env2, 'Jon', 'bot', 0.6);
  let token = null, roomId = null;
  const origJoin = a.net._joinRoom.bind(a.net);
  a.net._joinRoom = (room, tok) => { roomId = room; token = tok; origJoin(room, tok); };
  for (const c of [a, b]) c.net.find('casual', c.me, c.handlers);
  await flush();
  clock += 10500;
  await env2.MATCH.get(env2.MATCH.idFromName('casual')).o.alarm();
  for (let i = 0; i < 10; i++) await flush();
  a.net.close();
  await flush();
  const leftSeen = b.net.leftSlots.has(a.net.slot);
  let rejoinError = null;
  const ws = env2.socket('https://fake/room?' + new URLSearchParams({ id: roomId, pid: a.me.pid, token }));
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.t === 'error') rejoinError = m.code; };
  await flush();
  log(`EARLY END: all humans out at 5s → room ended at ${opts.endedAt ? opts.endedAt.toFixed(1) : '-'}s (early=${!!early}), AI floors ${aiFloors.join('/')} | LEAVE: others told=${leftSeen}, rejoin refused=${rejoinError === 'room'}`);
  return !!early && aiFloors.length === 3 && leftSeen && rejoinError === 'room';
}

// The reported bug: alone with 4 AI, fall, the AI results never arrive (old client / app killed),
// then refresh. The room must not crown the human: AI are ranked by their last relayed progress,
// and the room ends ~3 s after the last human result instead of waiting for the clock.
async function refreshAfterFall() {
  const env = makeEnv();
  const c = makeClient(env, 'Kim', 'mint', 0.4);
  c.noSettle = true;
  let roomId = null;
  const origJoin = c.net._joinRoom.bind(c.net);
  c.net._joinRoom = (room, tok) => { roomId = room; origJoin(room, tok); };
  c.net.find('casual', c.me, c.handlers);
  await flush();
  clock += 10500;
  await env.MATCH.get(env.MATCH.idFromName('casual')).o.alarm();
  for (let i = 0; i < 10; i++) await flush();
  const opts = { killAt: 20, stopAt: 21 };
  await race(env, [c], opts);
  const room = env.ROOM.get(env.ROOM.idFromString(roomId)).o;
  const quickAlarm = room.ctx.storage.alarm - clock;
  c.net.close(); // the refresh
  for (let i = 0; i < 6; i++) await flush();
  const me = await env.LEDGER.get(env.LEDGER.idFromName('global')).o.get(c.me.pid);
  const last = room.m.lastAi || {};
  const aiBest = Math.max(0, ...Object.values(last).map((x) => x.floor));
  const myFloor = room.m.results[c.net.slot].floor;
  const crowned = me.casualWins > 0;
  log(`REFRESH AFTER FALL: room end scheduled ≤${(quickAlarm / 1000).toFixed(1)}s after | ended=${room.m.ended} void=${room.m.void} | me ${myFloor}F vs AI last seen ${aiBest}F | crowned=${crowned}`);
  return room.m.ended && room.m.void && quickAlarm <= 3100 && Object.keys(last).length === 4 && !crowned;
}

// Leaderboards through the real Worker routes (index.js → Ledger) and the real client (net.js).
async function leaderboard() {
  const env = makeEnv();
  const net = new S.Net({ baseUrl: 'https://fake', fetchFn: (u, o) => worker.fetch(new Request(u, o), env) });
  const pid = (n) => 'pid-' + n + '-0000';
  const sent = [
    await net.submitScore(pid('ann'), 'Ann', 120),
    await net.submitScore(pid('bob'), 'Bob', 300),
    await net.submitScore(pid('cid'), 'Cid', 120), // ties go to whoever got there first
    await net.submitScore(pid('ann'), 'Ann', 80),  // lower: ignored
  ];
  const rejected = [
    await net.submitScore('x', 'Bad', 50),
    await net.submitScore(pid('eve'), 'Eve', 1e9),
    await net.submitScore(pid('eve'), 'Eve', -3),
  ];
  const t1 = await net.top('floor', pid('ann'));
  const order1 = t1.top.map((e) => e.name + ':' + e.v).join(',');
  const noIds = t1.top.every((e) => !('pid' in e)) && t1.top.filter((e) => e.me).length === 1;
  await net.claimNick(pid('ann'), 'Anna'); // renaming goes through the nickname registry
  const t2 = await net.top('floor', pid('ann'));
  const ledger = env.LEDGER.get(env.LEDGER.idFromName('global')).o;
  for (const id of [pid('ann'), pid('bob')]) { // past their placement matches
    const p = await ledger.get(id);
    p.placed = true;
    await ledger.ctx.storage.put('p:' + id, p);
  }
  await ledger.apply({ mode: 'ranked', players: [{ pid: pid('ann'), name: 'Anna', place: 1 }, { pid: pid('bob'), name: 'Bob', place: 5 }] });
  await ledger.apply({ mode: 'ranked', players: [{ pid: pid('ann'), name: 'Anna', place: 5 }] }); // peak stays 40
  const rp = await net.top('rp', pid('ann'));
  const outsider = await net.top('floor', pid('zed'));
  for (let i = 0; i < 120; i++) await net.submitScore(pid('p' + i), 'P' + i, 500 + i);
  const full = await net.top('floor', pid('ann'));
  const old = await new S.Net({ baseUrl: 'https://x', fetchFn: async () => new Response('Sky Tower online server') }).top('floor', pid('ann'));
  log(`LEADERBOARD: sent ${sent.join('/')} rejected ${rejected.join('/')} | floor top ${order1} (me #${t1.me.rank} ${t1.me.v}F, ids hidden=${noIds}) | renamed ${t2.top[1].name} | rp top ${rp.top.map((e) => e.name + ':' + e.v).join(',')} me ${rp.me.v} | outsider rank ${outsider.me.rank} | after 120 more: ${full.top.length} rows, me ${full.me.rank} ${full.me.v}F | old server → ${old}`);
  return sent.every(Boolean) && rejected.every((x) => !x) && order1 === 'Bob:300,Ann:120,Cid:120' && t1.me.rank === 2 && t1.me.v === 120 && noIds
    && t2.top[1].name === 'Anna' && t2.top[1].v === 120 && rp.top.length === 1 && rp.top[0].name === 'Anna' && rp.top[0].v === 40 && rp.me.v === 40
    && outsider.me.rank === null && full.top.length === rules.TOP_N && full.me.rank === null && full.me.v === 120 && old === 'outdated';
}

// Nicknames: one owner per name (case/width/space-insensitive), renaming frees the old name,
// and the matchmaker uses the registered name whatever the client sends.
async function nicknames() {
  const env = makeEnv();
  const net = new S.Net({ baseUrl: 'https://fake', fetchFn: (u, o) => worker.fetch(new Request(u, o), env), socketFactory: env.socket, now: () => clock });
  const A = 'pid-ann-0000', B = 'pid-bob-0000';
  const r = [];
  r.push(await net.claimNick(A, 'Sky Ace'));     // ok
  r.push(await net.claimNick(B, 'sky ace'));     // taken (case)
  r.push(await net.claimNick(B, 'ＳＫＹＡＣＥ'));  // taken (full width, spaces)
  r.push(await net.claimNick(A, 'Sky Ace'));     // ok (already mine)
  r.push(await net.claimNick(B, 'Bobby'));       // ok
  r.push(await net.claimNick(A, 'Ace'));         // ok, frees "Sky Ace"
  r.push(await net.claimNick(B, 'Sky Ace'));     // ok now
  r.push(await net.claimNick(A, 'Bobby'));       // taken? no: Bob renamed, so free → ok
  r.push(await net.claimNick(A, '   '));         // invalid
  const want = 'ok,taken,taken,ok,ok,ok,ok,ok,invalid';
  const old = await new S.Net({ baseUrl: 'https://x', fetchFn: async () => new Response('Sky Tower online server') }).claimNick(A, 'X');
  // Results with someone else's name don't rename a registered player.
  const ledger = env.LEDGER.get(env.LEDGER.idFromName('global')).o;
  await ledger.apply({ mode: 'casual', players: [{ pid: B, name: 'Bobby', place: 1 }] });
  const bAfter = (await ledger.get(B)).name;
  // The matchmaker shows the registered name, not the one in the request.
  const c = makeClient(env, 'Cheat', 'bot', 0.5);
  c.me.pid = B;
  c.me.name = 'Bobby';
  c.net.find('casual', c.me, c.handlers);
  await flush();
  const queued = env.MATCH.get(env.MATCH.idFromName('casual')).o.queue();
  const shown = queued.length ? queued[0].name : '?';
  c.net.cancel();
  await flush();
  log(`NICKNAMES: ${r.join(',')} (want ${want}) | old server → ${old} | results can't steal a name: ${bAfter} | queue shows registered name: ${shown}`);
  return r.join() === want && old === 'outdated' && bAfter === 'Sky Ace' && shown === 'Sky Ace';
}

// Hall of fame: in at 3000 floors (one solo run) or Master (2500 RP); records set before the hall
// existed are picked up from the leaderboards; renames follow; numbers only grow.
async function hallOfFame() {
  const env = makeEnv();
  const net = new S.Net({ baseUrl: 'https://fake', fetchFn: (u, o) => worker.fetch(new Request(u, o), env) });
  const ledger = env.LEDGER.get(env.LEDGER.idFromName('global')).o;
  const pid = (n) => 'pid-' + n + '-0000';
  // A record from before the hall of fame existed.
  await ledger.ctx.storage.put('top:floor', [{ pid: pid('old'), name: 'Veteran', v: 3500, t: 1 }]);
  await net.submitScore(pid('near'), 'Nearly', 2999);
  await net.submitScore(pid('ace'), 'Ace', 3001);
  await net.submitScore(pid('ace'), 'Ace', 3400); // better run: same entry, bigger number
  const m = await ledger.get(pid('mst'));
  Object.assign(m, { name: 'Maestro', nickSet: true, placed: true, rp: 2480, casualWins: 9 });
  await ledger.ctx.storage.put('p:' + m.pid, m);
  await ledger.apply({ mode: 'ranked', players: [{ pid: m.pid, name: 'Maestro', place: 1 }] }); // 2480 → 2520
  await net.claimNick(pid('ace'), 'AceHigh');
  const res = await net.top('hof', pid('ace'));
  const rows = res.hof.map((h) => `${h.name}:${h.floor || '-'}/${h.rp || '-'}${h.me ? '*' : ''}`).join(' ');
  const out = await net.top('hof', pid('near'));
  const old = await new S.Net({ baseUrl: 'https://x', fetchFn: async () => new Response(JSON.stringify({ type: 'floor', top: [], me: {} })) }).top('hof', pid('ace'));
  log(`HALL OF FAME: ${rows} | need ${res.need.floor}F / ${res.need.rp} RP | 2999F player in=${out.me.in} (best ${out.me.best}) | ranking-only server → ${old}`);
  return rows === 'Veteran:3500/- AceHigh:3400/-* Maestro:-/2520' && res.need.floor === 3000 && res.need.rp === 2500
    && out.me.in === false && out.me.best === 2999 && res.me.in === true && old === 'outdated';
}

// Ranked placement: five games with no RP change, then a first tier from Bronze to Gold.
async function placement() {
  const env = makeEnv();
  const ledger = env.LEDGER.get(env.LEDGER.idFromName('global')).o;
  const run = async (pid, places) => {
    const seen = [];
    for (const place of places) {
      const out = await ledger.apply({ mode: 'ranked', players: [{ pid, name: pid.slice(4, 8), place }] });
      seen.push(out[pid]);
    }
    return seen;
  };
  const gold = await run('pid-gold-0000', [1, 2, 1, 3, 2]);
  const silver = await run('pid-silv-0000', [3, 2, 4, 3, 3]);
  const bronze = await run('pid-brnz-0000', [5, 4, 5, 3, 4]);
  const quiet = gold.slice(0, 4).every((p, i) => !p.placed && p.rp === 0 && p.delta === 0 && p.tier === 'unranked' && p.placeN === i + 1);
  const g5 = gold[4], s5 = silver[4], b5 = bronze[4];
  const tiers = [g5, s5, b5].map((p) => `${p.tier}:${p.rp}${p.placedNow ? '*' : ''}`).join(' ');
  const after = (await run('pid-gold-0000', [1]))[0];
  // Placement players wait in the queue as if they were mid-Silver.
  const c = makeClient(env, 'Newb', 'bot', 0.5);
  c.me.pid = 'pid-newb-0000';
  await ledger.ctx.storage.put('p:' + c.me.pid, { pid: c.me.pid, name: 'Newb', casualWins: 5, rankedGames: 0, placed: false, placements: [] });
  c.net.find('ranked', c.me, c.handlers);
  await flush();
  const q = env.MATCH.get(env.MATCH.idFromName('ranked')).o.queue();
  const pairRp = q.length ? q[0].rp : -1;
  c.net.cancel();
  await flush();
  const board = await ledger.top('rp', 'pid-gold-0000');
  log(`PLACEMENT: games 1-4 silent=${quiet} | after 5: ${tiers} | next game ${after.delta >= 0 ? '+' : ''}${after.delta} → ${after.rp} | queue rating while placing ${pairRp} | rp board ${board.top.map((e) => e.name + ':' + e.v).join(',')}`);
  return quiet && g5.placedNow && g5.tier === 'gold' && g5.rp === 730 && s5.tier === 'silver' && s5.rp === 400 && b5.tier === 'bronze' && b5.rp === 125
    && after.delta === 40 && after.rp === 770 && !after.placedNow && pairRp === rules.PLACEMENT_RP && board.top.length === 3 && board.top[0].v === 770;
}

// Network smoothing: a rival moving at a steady 4 u/s, sent at 20 Hz over a link with
// 40–160 ms delay (so packets arrive bunched and out of order) and 5% loss. Drawn at 60 fps it
// must move forward every frame, at close to its real speed.
function netSmooth() {
  let now = 1e6;
  const net = new S.Net({ baseUrl: '', now: () => now });
  net.phase = 'room';
  net.slot = 0;
  net.roster = [{ slot: 0 }, { slot: 1 }];
  const me = { x: 0, y: 0, vx: 0, vy: 0, floor: 0, floorT: 0, grounded: true, dead: false, shields: 0, human: true };
  const them = { slot: 1, remote: true, x: 0, y: 5, vx: 0, vy: 0 };
  const sim = { p: me, bodies: [me, them] };
  const rng = S.mulberry(7);
  const inbox = [];
  for (let ts = now; ts < now + 9000; ts += 50) {
    if (rng() < 0.05) continue;
    const tsec = (ts - 1e6) / 1000;
    inbox.push({ at: ts + 40 + rng() * 120, s: { ts, x: 4 * tsec, y: 5, vx: 4, vy: 0, f: 1, ft: 0, g: 1, d: 0, sh: 0 } });
  }
  inbox.sort((a, b) => a.at - b.at);
  const dt = 1 / 60, ideal = 4 * dt;
  let back = 0, worst = 0, sumErr = 0, n = 0, prev = null, lag = 0;
  for (let f = 0; f < 60 * 8.5; f++) {
    now += dt * 1000;
    while (inbox.length && inbox[0].at <= now) net._push(1, inbox.shift().s);
    net.update(sim, dt);
    if (f > 120 && prev !== null) {
      const step = S.wrapD(them.x - prev);
      if (step < 0) back++;
      worst = Math.max(worst, Math.abs(step - ideal));
      sumErr += Math.abs(step - ideal);
      n++;
      lag = Math.max(lag, 4 * ((now - 1e6) / 1000) - them.x);
    }
    prev = them.x;
  }
  log(`NET SMOOTH: playback delay settled at ${net.delay.toFixed(0)} ms | backward steps ${back} | per-frame step error avg ${(sumErr / n).toFixed(4)} max ${worst.toFixed(4)} (ideal step ${ideal.toFixed(4)}) | trails truth by ≤${lag.toFixed(2)} u`);
  return back === 0 && worst < ideal * 0.6 && net.delay > 70 && net.delay < 400;
}

async function versionCheck() {
  const mk = (body) => new S.Net({ baseUrl: 'https://x', fetchFn: async () => new Response(body) });
  const ok = await mk(JSON.stringify({ ok: true, v: S.NET_PROTOCOL })).health();
  const old = await mk(JSON.stringify({ ok: true, v: 1 })).health();
  const off = await new S.Net({ baseUrl: 'https://x', fetchFn: async () => { throw new Error('down'); } }).health();
  log(`VERSION: current=${ok} old-server=${old} unreachable=${off} (client protocol ${S.NET_PROTOCOL}, server ${rules.PROTOCOL})`);
  return ok === 'ok' && old === 'outdated' && off === 'offline' && S.NET_PROTOCOL === rules.PROTOCOL;
}

(async () => {
  const t0 = performance.now();
  let pass = true;
  try {
    pass = unitRules() && pass;
    pass = (await versionCheck()) && pass;
    pass = (await leaderboard()) && pass;
    pass = (await nicknames()) && pass;
    pass = (await placement()) && pass;
    pass = (await hallOfFame()) && pass;
    pass = netSmooth() && pass;
    pass = (await refreshAfterFall()) && pass;
    pass = (await casualMatch()) && pass;
    pass = (await rankedHostDrop()) && pass;
    pass = (await earlyEndAndRejoin()) && pass;
  } catch (e) {
    pass = false;
    log('EXCEPTION ' + e.stack);
  }
  log(`\n${pass ? 'ALL PASS' : 'FAILED'} in ${(performance.now() - t0).toFixed(0)}ms`);
  document.getElementById('out').textContent = lines.join('\n');
  window.__done = pass;
})();
