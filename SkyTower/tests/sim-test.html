<!doctype html>
<meta charset="utf-8">
<title>Sim tests</title>
<pre id="out" style="font:13px monospace;white-space:pre-wrap">running…</pre>
<script src="../www/js/data.js"></script>
<script src="../www/js/sim.js"></script>
<script src="../www/js/bot.js"></script>
<script>
const S = window.SKY, C = S.CFG, lines = [];
const log = (s) => lines.push(s);

// 1. Every consecutive golden pair must be clearable from a standing start at the near edge.
function reachability(seeds, floors) {
  let tested = 0, fails = [], worstFloor = -1, typeCount = {};
  for (let seed = 1; seed <= seeds; seed++) {
    const gen = new S.Sim();
    gen.reset(seed * 7919, 0, { opening: S.OPENINGS[seed % S.OPENINGS.length] });
    gen.p.y = 0;
    const list = [gen.findGolden(0)];
    while (gen.genFloor < floors) { gen._generateFloor(); }
    for (let f = 1; f <= floors; f++) { const g = gen.findGolden(f); if (!g) throw new Error('missing floor ' + f); list.push(g); }
    for (let i = 0; i + 1 < list.length; i++) {
      const a = list[i], b = list[i + 1];
      typeCount[b.type] = (typeCount[b.type] || 0) + 1;
      tested++;
      const sim = new S.Sim();
      sim.plats.length = 0;
      const A = sim._plat(a.x, 0, a.hw, S.PT.NORMAL, 0, false);
      const B = sim._plat(b.x, b.y - a.y, b.hw, S.PT.NORMAL, 1, false);
      sim.last = { y: 1e9 };
      const dir = Math.sign(S.wrapD(B.x - A.x)) || 1;
      Object.assign(sim.p, { x: A.x + dir * (A.hw - 0.05), y: 0, vx: 0, vy: 0, grounded: true, ground: A });
      sim.coins.length = 0;
      sim.lavaY = -1e6;
      let ok = false;
      for (let n = 0; n < 240; n++) {
        const dx = S.wrapD(B.x - sim.p.x);
        sim.step({ move: Math.abs(dx) > B.hw * 0.5 ? Math.sign(dx) : 0, jump: true });
        if (sim.p.grounded && sim.p.ground === B) { ok = true; break; }
        if (sim.p.y < -4) break;
      }
      if (!ok) { fails.push(`seed ${seed} floor ${b.floor} dy=${(b.y - a.y).toFixed(2)} dx=${S.wrapD(b.x - a.x).toFixed(2)} hw=${a.hw.toFixed(2)}/${b.hw.toFixed(2)}`); if (worstFloor < 0) worstFloor = b.floor; }
    }
  }
  log(`REACHABILITY: ${tested - fails.length}/${tested} jumps cleared across ${seeds} seeds, ${floors} floors each`);
  log(`  golden types: ${JSON.stringify(typeCount)}`);
  fails.slice(0, 10).forEach((f) => log('  FAIL ' + f));
  return fails.length === 0;
}

// 2. Variable jump height: tap vs hold.
function jumpHeights() {
  const measure = (holdSteps) => {
    const sim = new S.Sim();
    sim.lavaY = -1e6;
    let top = 0;
    for (let n = 0; n < 240; n++) {
      sim.step({ move: 0, jump: n < holdSteps });
      top = Math.max(top, sim.p.y);
      if (n > 5 && sim.p.grounded) break;
    }
    return top;
  };
  const tap = measure(2), mid = measure(18), full = measure(120);
  log(`JUMP HEIGHT: tap ${tap.toFixed(2)}  0.15s ${mid.toFixed(2)}  hold ${full.toFixed(2)}  (generator max dy ${C.MAX_DY})`);
  return tap < mid && mid < full && full > C.MAX_DY + 0.3;
}

// 3. Full games by bots at different skill levels.
function bots() {
  let ok = true;
  for (const skill of [0.25, 0.5, 0.75, 1]) {
    const durs = [], floors = [];
    let maxPlats = 0, maxCoins = 0;
    for (let g = 0; g < 12; g++) {
      const sim = new S.Sim();
      sim.reset(1000 + g * 31, 0);
      const bot = new S.Bot(skill, g + 1);
      let n = 0;
      while (!sim.dead && n < 120 * 60 * 15) { sim.step(bot.update(sim, C.DT)); n++; maxPlats = Math.max(maxPlats, sim.plats.length); maxCoins = Math.max(maxCoins, sim.coins.length); }
      durs.push(n / 120); floors.push(sim.floor);
    }
    durs.sort((a, b) => a - b); floors.sort((a, b) => a - b);
    const med = (a) => a[a.length >> 1];
    log(`BOT skill ${skill}: median ${med(durs).toFixed(0)}s, floors med ${med(floors)} (min ${floors[0]}, max ${floors[floors.length - 1]}), durations ${durs[0].toFixed(0)}-${durs[durs.length - 1].toFixed(0)}s, active plats ≤${maxPlats}, coins ≤${maxCoins}`);
  }
  return ok;
}

// 3b. Ledge assist: a jump whose peak leaves the feet just under a top lands on it,
//     while one that peaks clearly below still drops back down.
function ledge() {
  const tryJump = (holdSteps, topY) => {
    const sim = new S.Sim();
    sim.reset(3, 0);
    sim.plats.length = 0;
    const A = sim._plat(0, 0, 3, S.PT.NORMAL, 0, false);
    const B = sim._plat(0, topY, 3, S.PT.NORMAL, 1, false);
    sim.last = { y: 1e9 };
    sim.coins.length = 0;
    sim.lavaY = -1e6;
    Object.assign(sim.p, { x: 0, px: 0, y: 0, py: 0, vx: 0, vy: 0, grounded: true, ground: A });
    let peak = 0;
    for (let n = 0; n < 240; n++) {
      sim.step({ move: 0, jump: n < holdSteps });
      peak = Math.max(peak, sim.p.y);
      if (n > 5 && sim.p.grounded) return { on: sim.p.ground === B, peak };
    }
    return { on: false, peak };
  };
  const justUnder = tryJump(14, 2.75);   // peaks ~0.3 under the top
  const wayUnder = tryJump(2, 2.75);     // short hop, peaks ~1.2 under
  const normal = tryJump(120, 2.75);     // full jump clears the top normally
  log(`LEDGE: peak ${justUnder.peak.toFixed(2)} vs top 2.75 → landed=${justUnder.on} | short hop peak ${wayUnder.peak.toFixed(2)} → landed=${wayUnder.on} | full jump → landed=${normal.on}`);
  return justUnder.on && !wayUnder.on && normal.on;
}

// 3c. Human-like jumps: count misses where the body visibly overlapped the platform
//     (center within hw + 0.65, feet inside the 0.85-thick slab) but still fell through.
function feltFalls() {
  const rnd = S.mulberry(42), R = (a, b) => a + (b - a) * rnd();
  let att = 0, landed = 0, felt = 0;
  for (let seed = 1; seed <= 40; seed++) {
    const gen = new S.Sim();
    gen.reset(seed * 101, 0);
    while (gen.genFloor < 90) gen._generateFloor();
    for (let f = 1; f <= 85; f++) {
      const a = gen.findGolden(f - 1), b = gen.findGolden(f);
      const sim = new S.Sim();
      sim.plats.length = 0;
      const A = sim._plat(a.x, 0, a.hw, 0, 0, false), B = sim._plat(b.x, b.y - a.y, b.hw, 0, 1, false);
      sim.last = { y: 1e9 };
      sim.coins.length = 0;
      sim.lavaY = -1e6;
      const dir = Math.sign(S.wrapD(B.x - A.x)) || 1;
      Object.assign(sim.p, { x: A.x + dir * A.hw * R(-0.3, 1), y: 0, vx: 0, vy: 0, grounded: true, ground: A });
      sim.p.px = sim.p.x; sim.p.py = 0;
      const hold = R(0.04, 0.45), delay = R(0, 0.18), stopAt = R(0, B.hw * 0.9);
      att++;
      let apex = -9, apexDx = 9, cross = false;
      for (let n = 0; n < 300; n++) {
        const t = n * C.DT, dx = S.wrapD(B.x - sim.p.x), oy = sim.p.y;
        sim.step({ move: t > delay ? (Math.abs(dx) > stopAt ? Math.sign(dx) : 0) : 0, jump: t < hold });
        const p = sim.p, adx = Math.abs(S.wrapD(p.x - B.x));
        if (!p.grounded && oy >= B.y && p.y < B.y && adx <= B.hw + 0.65) cross = true;
        if (p.y > apex) { apex = p.y; apexDx = adx - B.hw; }
        if ((p.grounded && n > 3) || p.y < -3) break;
      }
      if (sim.p.grounded && sim.p.ground === B) { landed++; continue; }
      if (cross || (apex < B.y && apex > B.y - 0.85 && apexDx <= 0.65)) felt++;
    }
  }
  const pct = (felt / att) * 100;
  log(`FELT FALLS: ${felt}/${att} jumps (${pct.toFixed(2)}%) looked on the platform but fell; landed ${landed}`);
  return pct <= 1;
}

// 3d. Elevator start, online lava schedule, and remote-body collisions.
function elevatorAndOnline() {
  const sim = new S.Sim();
  sim.reset(77, 0, { startFloor: 180 });
  const q = sim.findGolden(180);
  const elevOk = sim.floor === 180 && sim.p.grounded && sim.p.ground === q && Math.abs(sim.lavaY - (q.y + C.LAVA_START)) < 1e-6;
  sim.started = true;
  for (let i = 0; i < 240; i++) sim.step({ move: 0, jump: false });
  const elevStill = !sim.dead && sim.floor === 180;

  const runOnline = () => {
    const s = new S.Sim();
    s.reset(5, 0, { online: true, racers: [{ skin: S.SKINS[1], perk: S.perkFor(null), remote: true }] });
    s.started = true;
    for (let i = 0; i < 120 * 20; i++) s.step({ move: i % 200 < 100 ? 1 : -1, jump: i % 60 < 20 });
    return s;
  };
  const o1 = runOnline(), o2 = runOnline();
  const lavaOk = Math.abs(o1.lavaY - o1.lavaAt(o1.runTime)) < 1e-6 && Math.abs(o1.lavaY - o2.lavaY) < 1e-9;

  const c = new S.Sim();
  c.reset(9, 0, { online: true, racers: [{ skin: S.SKINS[2], perk: S.perkFor(null), remote: true }] });
  const me = c.p, them = c.bodies[1];
  Object.assign(them, { x: me.x + 0.5, y: me.y, vx: -6, vy: 0, grounded: true, ground: me.ground });
  me.vx = 6;
  const tx = them.x, tvx = them.vx;
  c._collide();
  const remoteOk = them.x === tx && them.vx === tvx && me.vx < 6;
  log(`ELEVATOR: start 180F on golden=${elevOk}, still alive after 2s=${elevStill} | ONLINE lava fixed+deterministic=${lavaOk} | remote collision only moves me=${remoteOk}`);
  return elevOk && elevStill && lavaOk && remoteOk;
}

// 4. Abilities change the physics the way their descriptions promise.
function perks() {
  const top = (ab, presses) => {
    const sim = new S.Sim();
    sim.reset(5, 0, { perk: S.perkFor(ab), ab });
    sim.lavaY = -1e6;
    sim.last = { y: 1e9 };
    sim.plats.length = 1;
    let best = 0, n = 0;
    const pressAt = new Set(presses);
    for (; n < 400; n++) {
      sim.step({ move: 0, jump: n < 60 || pressAt.has(n) || (n > 60 && [...pressAt].some((t) => n > t && n < t + 40)) });
      best = Math.max(best, sim.p.y);
      if (n > 5 && sim.p.grounded) break;
    }
    return best;
  };
  const base = top(null, []), dbl = top('double', [70]), tri = top('rocket', [70, 130]), leap = top('leap', []);
  const shield = (() => {
    const sim = new S.Sim();
    sim.reset(5, 0, { perk: S.perkFor('phoenix'), ab: 'phoenix' });
    sim.started = true;
    sim.lavaY = sim.p.y + 1;
    let saves = 0;
    sim.emit = (n) => { if (n === 'shield') saves++; };
    for (let i = 0; i < 1200 && !sim.dead; i++) { sim.lavaY = Math.max(sim.lavaY, sim.p.y + 0.5); sim.step({ move: 0, jump: false }); }
    return { saves, dead: sim.dead };
  })();
  const magnet = (() => {
    const sim = new S.Sim();
    sim.reset(5, 0, { perk: S.perkFor('magnet'), ab: 'magnet' });
    sim.coins.length = 0;
    sim._coin(sim.p.x + 4, sim.p.y + 1);
    for (let i = 0; i < 120; i++) sim.step({ move: 0, jump: false });
    return sim.coinCount;
  })();
  log(`PERKS: jump top base ${base.toFixed(2)} | leap ${leap.toFixed(2)} | double ${dbl.toFixed(2)} | rocket ${tri.toFixed(2)} | phoenix saves ${shield.saves} then dead=${shield.dead} | magnet pulled ${magnet} coin`);
  return leap > base && dbl > base + 1 && tri > dbl && shield.saves === 2 && shield.dead && magnet === 1;
}

// 5. Races: five bots (human slot driven by a bot) share one tower, push and stomp, and finish.
function races() {
  let ok = true, bumps = 0, stomps = 0, runs = 0;
  const floors = [], winners = {};
  for (let g = 0; g < 16; g++) {
    const racers = [];
    for (let i = 0; i < 4; i++) {
      const ab = S.AI_ABILITIES[(g * 4 + i) % S.AI_ABILITIES.length];
      racers.push({ skin: S.SKINS[i + 1], ab, perk: S.perkFor(ab), bot: new S.Bot(0.5 + i * 0.12, g * 10 + i, 0.4) });
    }
    const sim = new S.Sim((n) => { if (n === 'bump') bumps++; else if (n === 'stomp') stomps++; });
    sim.reset(4000 + g, 0, { racers });
    const me = new S.Bot(0.7, 99 + g, 0.2);
    sim.started = true;
    let n = 0;
    for (; n < S.RACE.dur * 120 && sim.bodies.some((b) => !b.dead); n++) sim.step(me.update(sim, C.DT));
    runs++;
    const fl = sim.bodies.map((b) => b.floor);
    floors.push(fl);
    if (fl.some((f) => f !== f)) ok = false;
    const w = sim.bodies.slice().sort((a, b) => b.floor - a.floor || a.floorT - b.floorT)[0];
    winners[w.human ? 'human' : w.ab] = (winners[w.human ? 'human' : w.ab] || 0) + 1;
  }
  const all = floors.flat().sort((a, b) => a - b);
  log(`RACES: ${runs} races, floors min ${all[0]} median ${all[all.length >> 1]} max ${all[all.length - 1]}, bumps ${bumps}, stomps ${stomps}`);
  log(`  winners: ${JSON.stringify(winners)}`);
  return ok && bumps > 0 && all[all.length - 1] > 10;
}

setTimeout(() => {
  const t0 = performance.now();
  let pass = true;
  try {
    pass = jumpHeights() && pass;
    pass = reachability(20, 700) && pass;
    pass = bots() && pass;
    pass = ledge() && pass;
    pass = feltFalls() && pass;
    pass = elevatorAndOnline() && pass;
    pass = perks() && pass;
    pass = races() && pass;
  } catch (e) { pass = false; log('EXCEPTION ' + e.stack); }
  log(`\n${pass ? 'ALL PASS' : 'FAILED'} in ${(performance.now() - t0).toFixed(0)}ms`);
  document.getElementById('out').textContent = lines.join('\n');
  window.__done = pass;
}, 20);
</script>
