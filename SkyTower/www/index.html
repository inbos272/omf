<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ONE MORE FLOOR: SKY TOWER</title>
<meta name="description" content="Climb an endless sky tower, outrun the rising lava, and race AI rivals. Works offline.">
<meta name="theme-color" content="#1f78ea">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky Tower">
<meta name="application-name" content="Sky Tower">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <!-- MAIN MENU -->
  <section id="menu" class="screen hidden">
    <header class="logo">
      <span class="logo-small">ONE MORE</span>
      <span class="logo-big">FLOOR</span>
      <span class="logo-pill">SKY TOWER</span>
    </header>
    <div class="menu-stats">
      <div class="chip"><small data-i18n="menu.best"></small><b id="mBest">0</b></div>
      <div class="chip"><small data-i18n="menu.coins"></small><b><i class="coin"></i><span id="mCoins">0</span></b></div>
    </div>
    <div class="menu-actions">
      <button id="btnPlay" class="btn btn-play" data-i18n="menu.play"></button>
      <button id="btnVersus" class="btn btn-race"><span class="race-main"><svg viewBox="0 0 24 24"><path d="M5 3h2v18H5zm3 1h11l-2.5 4L19 12H8z"/></svg><span data-i18n="menu.versus"></span></span><small id="mVersusSub"></small></button>
      <div class="menu-row">
        <button id="btnCustom" class="btn btn-sub"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c.6-5 4-7.4 8-7.4s7.4 2.4 8 7.4z"/></svg><span data-i18n="menu.char"></span></button>
        <button id="btnShop" class="btn btn-sub"><svg viewBox="0 0 24 24"><path d="M5 9h14l-1.2 11.2H6.2zM8.5 9V7a3.5 3.5 0 0 1 7 0v2h-2V7a1.5 1.5 0 0 0-3 0v2z"/></svg><span data-i18n="menu.shop"></span></button>
        <button id="btnSettings" class="btn btn-sub"><svg viewBox="0 0 24 24"><path d="M3 7h9.2a3 3 0 0 1 5.6 0H21v2h-3.2a3 3 0 0 1-5.6 0H3zm0 8h3.2a3 3 0 0 1 5.6 0H21v2h-9.2a3 3 0 0 1-5.6 0H3z"/></svg><span data-i18n="menu.settings"></span></button>
      </div>
    </div>
  </section>

  <!-- GAME HUD -->
  <section id="hud" class="screen hidden">
    <div id="lavaGlow"></div>
    <div id="tags"></div>
    <div class="ctl" id="ctlMove">
      <div class="dpad">
        <div id="btnLeft" class="dir"><svg viewBox="0 0 24 24"><path d="M15.6 3.6L7 12l8.6 8.4 2.4-2.4L11.8 12 18 6z"/></svg></div>
        <div id="btnRight" class="dir"><svg viewBox="0 0 24 24"><path d="M8.4 3.6L17 12l-8.6 8.4L6 18l6.2-6L6 6z"/></svg></div>
      </div>
      <div id="stickBase"><div id="stickKnob"></div></div>
    </div>
    <div class="ctl" id="ctlJump"><div id="jumpBtn"><svg viewBox="0 0 24 24"><path d="M12 4l8 9h-5v7H9v-7H4z"/></svg></div></div>
    <div class="hud-top">
      <button id="btnPause" class="icon-btn" data-i18n-aria="hud.pause"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4.4" height="16" rx="1.4"/><rect x="13.6" y="4" width="4.4" height="16" rx="1.4"/></svg></button>
      <div class="hud-floor"><span id="hFloor">0</span><small data-i18n="unit.floor"></small></div>
      <div class="hud-right">
        <div class="hud-coins"><i class="coin"></i><span id="hCoins">0</span></div>
        <div id="hAbility" class="hud-ability"></div>
      </div>
    </div>
    <div class="hud-goal" id="hudGoal">
      <div class="goal-bar"><i id="hGoalFill"></i></div>
      <span id="hGoal"></span>
    </div>
    <div class="race-bar" id="raceBar">
      <span id="rTimer" class="race-timer">1:30</span>
      <span id="rRank" class="race-rank">1</span>
    </div>
    <div id="raceBoard"></div>
    <button id="btnElev" class="elev-btn hidden"><span>🛗</span><b data-i18n="elev.btn"></b></button>
    <div id="elevCounter" class="elev-counter hidden"><span id="elevFloor">0</span><small data-i18n="unit.floor"></small></div>
    <div id="bestTag" data-i18n="hud.bestTag"></div>
    <div id="lavaSlow" data-i18n="hud.lavaSlow"></div>
    <div id="banner"><small id="bSmall"></small><b id="bBig"></b><span id="bSub"></span></div>
    <div id="pop"></div>
    <div id="toast"></div>
    <div id="countdown"></div>
  </section>

  <!-- PAUSE -->
  <section id="pause" class="screen modal hidden">
    <div class="panel narrow">
      <h2 data-i18n="pause.title"></h2>
      <div class="pause-stat"><span id="pFloor">0</span><small id="pBest"></small></div>
      <button id="btnResume" class="btn btn-play" data-i18n="pause.resume"></button>
      <button id="btnRestart" class="btn btn-wide" data-i18n="pause.restart"></button>
      <button id="btnPauseSettings" class="btn btn-wide" data-i18n="menu.settings"></button>
      <button id="btnQuit" class="btn btn-wide btn-ghost" data-i18n="pause.quit"></button>
    </div>
  </section>

  <!-- GAME OVER -->
  <section id="over" class="screen modal hidden">
    <div class="panel narrow over-panel">
      <div id="oTag" class="over-tag"></div>
      <div class="over-floor"><span id="oFloor">0</span><small data-i18n="unit.floor"></small></div>
      <div class="over-compare">
        <div class="cmp-bar"><i id="oBar"></i></div>
        <p id="oCompare"></p>
      </div>
      <dl class="over-coins">
        <div><dt data-i18n="over.picked"></dt><dd id="oPicked">0</dd></div>
        <div><dt data-i18n="over.bonus"></dt><dd id="oBonus">0</dd></div>
        <div class="total"><dt data-i18n="over.earned"></dt><dd><i class="coin"></i><span id="oEarned">0</span></dd></div>
      </dl>
      <ul id="oRewards"></ul>
      <button id="btnAgain" class="btn btn-play" data-i18n="over.again"></button>
      <button id="btnOverMenu" class="btn btn-wide btn-ghost" data-i18n="pause.quit"></button>
    </div>
  </section>

  <!-- RACE RESULT -->
  <section id="raceOver" class="screen modal hidden">
    <div class="panel narrow race-panel">
      <div id="rrTag" class="over-tag"></div>
      <h2 id="rrTitle" class="race-title"></h2>
      <ol id="rrList" class="race-list"></ol>
      <dl class="over-coins">
        <div id="rrRp" class="rp-row hidden"><dt data-i18n="rr.rp"></dt><dd></dd></div>
        <div><dt data-i18n="race.rankReward"></dt><dd id="rrRank">0</dd></div>
        <div><dt data-i18n="over.picked"></dt><dd id="rrPicked">0</dd></div>
        <div class="total"><dt data-i18n="over.earned"></dt><dd><i class="coin"></i><span id="rrEarned">0</span></dd></div>
      </dl>
      <button id="btnRaceAgain" class="btn btn-play" data-i18n="race.again"></button>
      <button id="btnRaceMenu" class="btn btn-wide btn-ghost" data-i18n="pause.quit"></button>
    </div>
  </section>

  <!-- CUSTOMIZE + SHOP -->
  <section id="coll" class="screen hidden">
    <div class="coll-top">
      <button id="btnCollBack" class="icon-btn" data-i18n-aria="common.back"><svg viewBox="0 0 24 24"><path d="M15.5 4L7 12l8.5 8 2-2.2L11.4 12l6.1-5.8z"/></svg></button>
      <h2 id="collTitle"></h2>
      <div class="hud-coins"><i class="coin"></i><span id="collCoins">0</span></div>
    </div>
    <div id="dragArea"></div>
    <div class="sheet">
      <div class="preview-name"><b id="prevName"></b><span id="prevTag"></span></div>
      <div id="prevAbility" class="prev-ability"></div>
      <div class="tabs" id="collTabs"></div>
      <div class="grid" id="collGrid"></div>
      <div class="sheet-foot"><button id="btnCollAction" class="btn btn-play"></button></div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="screen modal hidden">
    <div class="panel settings-panel">
      <div class="panel-head"><h2 data-i18n="set.title"></h2><button id="btnSetClose" class="icon-btn" data-i18n-aria="common.close"><svg viewBox="0 0 24 24"><path d="M6.2 4.2L12 10l5.8-5.8 2 2L14 12l5.8 5.8-2 2L12 14l-5.8 5.8-2-2L10 12 4.2 6.2z"/></svg></button></div>
      <div class="scroll">
        <h3 data-i18n="set.nick"></h3>
        <div class="nick-row"><input id="sNick" type="text" maxlength="12" autocomplete="off" spellcheck="false"><button id="btnNickSave" class="btn btn-wide" data-i18n="set.nickSave"></button></div>
        <h3 data-i18n="set.lang"></h3>
        <div class="langs" id="sLang"></div>
        <h3 data-i18n="set.sound"></h3>
        <div id="volList"></div>
        <h3 data-i18n="set.controls"></h3>
        <label class="row"><span><span data-i18n="set.swap"></span><small data-i18n="set.swapSub"></small></span><input id="sSwap" type="checkbox" class="sw"></label>
        <label class="row"><span><span data-i18n="set.one"></span><small data-i18n="set.oneSub"></small></span><input id="sOne" type="checkbox" class="sw"></label>
        <label class="row" id="rowHaptic"><span data-i18n="set.haptics"></span><input id="sHaptic" type="checkbox" class="sw"></label>
        <label class="row"><span data-i18n="set.shake"></span><input id="sShake" type="checkbox" class="sw"></label>
        <h3 data-i18n="set.graphics"></h3>
        <div class="seg" id="sQuality">
          <button data-q="auto" data-i18n="q.auto"></button><button data-q="low" data-i18n="q.low"></button><button data-q="medium" data-i18n="q.medium"></button><button data-q="high" data-i18n="q.high"></button>
        </div>
        <h3 data-i18n="set.data"></h3>
        <button id="btnReset" class="btn btn-wide btn-danger" data-i18n="set.reset"></button>
        <p class="credit" data-i18n="set.local"></p>
      </div>
    </div>
  </section>

  <!-- VERSUS -->
  <section id="versus" class="screen modal hidden">
    <div class="panel narrow">
      <div class="panel-head"><h2 data-i18n="vs.title"></h2><button id="btnVsClose" class="icon-btn" data-i18n-aria="common.close"><svg viewBox="0 0 24 24"><path d="M6.2 4.2L12 10l5.8-5.8 2 2L14 12l5.8 5.8-2 2L12 14l-5.8 5.8-2-2L10 12 4.2 6.2z"/></svg></button></div>
      <button id="vsAi" class="vs-item"><span class="vs-icon">🤖</span><span class="vs-text"><b data-i18n="vs.ai"></b><small id="vsAiSub"></small></span></button>
      <button id="vsCasual" class="vs-item"><span class="vs-icon">🌐</span><span class="vs-text"><b data-i18n="vs.casual"></b><small id="vsCasualSub"></small></span></button>
      <button id="vsRanked" class="vs-item"><span class="vs-icon" id="vsRankIcon">🏆</span><span class="vs-text"><b data-i18n="vs.ranked"></b><small id="vsRankedSub"></small></span></button>
      <p id="vsStatus" class="credit"></p>
    </div>
  </section>

  <!-- MATCHMAKING -->
  <section id="matching" class="screen modal hidden">
    <div class="panel narrow match-panel">
      <h2 id="mtTitle"></h2>
      <div class="spinner"></div>
      <p id="mtCount" class="mt-count"></p>
      <p id="mtSub" class="credit"></p>
      <button id="btnMtCancel" class="btn btn-wide btn-ghost" data-i18n="confirm.no"></button>
    </div>
  </section>

  <!-- ELEVATOR -->
  <section id="elevator" class="screen modal hidden">
    <div class="panel narrow">
      <div class="panel-head"><h2>🛗 <span data-i18n="elev.title"></span></h2><button id="btnElevClose" class="icon-btn" data-i18n-aria="common.close"><svg viewBox="0 0 24 24"><path d="M6.2 4.2L12 10l5.8-5.8 2 2L14 12l5.8 5.8-2 2L12 14l-5.8 5.8-2-2L10 12 4.2 6.2z"/></svg></button></div>
      <p class="confirm-text" data-i18n="elev.sub"></p>
      <div id="elevList" class="elev-list"></div>
      <p class="credit"><i class="coin"></i> <span id="elevCoins">0</span></p>
    </div>
  </section>

  <!-- CONFIRM -->
  <section id="confirm" class="screen modal hidden">
    <div class="panel narrow">
      <h2 data-i18n="confirm.title"></h2>
      <p class="confirm-text" data-i18n="confirm.text"></p>
      <button id="btnResetYes" class="btn btn-wide btn-danger" data-i18n="confirm.yes"></button>
      <button id="btnResetNo" class="btn btn-wide" data-i18n="confirm.no"></button>
    </div>
  </section>

  <!-- FIRST RUN: LANGUAGE -->
  <section id="langPick" class="screen modal hidden">
    <div class="panel narrow">
      <h2 class="lang-title">Language · 언어 · 言語 · 语言 · Idioma</h2>
      <div class="langs big" id="langList"></div>
      <p class="credit" data-i18n="lang.sub"></p>
    </div>
  </section>

  <div id="fatal" class="hidden"><div><h2 data-i18n="fatal.title"></h2><p data-i18n="fatal.text"></p></div></div>
</div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/sim.js"></script>
<script src="js/bot.js"></script>
<script src="js/net.js"></script>
<script src="js/gfx.js"></script>
<script src="js/scene.js"></script>
<script src="js/music.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/input.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
